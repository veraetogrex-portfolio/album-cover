<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>T47 Album Cover — a photo from the trip becomes the face of the album</title>
<link rel="stylesheet" href="_shared/nocturne.css">
<link rel="stylesheet" href="../style.css">
<style>
  /* the whole app screen from ../, in Nocturne type; no grid on the app screen */
  #stage{background:#07080C}
  #stage .ac{position:absolute;left:0;top:0;--font:var(--f-text)}
  body.autoplay #stage :focus-visible{outline:none}
  body.autoplay #li-cursor{transition:none}   /* visible from frame one, no fade at the loop seam */
  #li-cursor svg{transform:scale(1.5);transform-origin:4px 3px}   /* the arrow stays readable in a phone-sized reel */
  #li-cursor.down svg{transform:scale(1.3)}
  #li-cursor.grab svg{transform:scale(2.1)}   /* the hand that carries the photo reads as a hand at phone size */
  #li-cursor.grab.down svg{transform:scale(1.9)}
</style>
</head>
<body>
<div id="stage" data-title="T47 Album Cover" data-url="veraetogrex-portfolio.github.io/album-cover">
  <section class="ac" aria-label="VECTOR Photos" data-assets="../assets/"></section>
</div>
<script src="_shared/stage.js"></script>
<script src="../script.js"></script>
<script>
const app = document.querySelector('.ac').albumApp;
const at = (sel, dx = 0, dy = 0) => { const r = Stage.rect(document.querySelector(sel)); return [r.cx + dx, r.cy + dy]; };
const REST = [1080, 560];
// one act: albums → Weekend at Lake Orta → "Dawn on the pier" carried onto the cover → the family's copy follows
Stage.init({
  reset: () => { app.reset(); app.syncDelay = 2820; },   // the sidebar and the family preview change as the camera pulls out
  cursorStart: REST,
  async demo(s) {
    const t0 = performance.now();
    await s.until(t0, 1000);                                     // the whole albums screen at rest first
    await s.move(at('.ac-album[data-open] .ac-ph', 0, -14), 650); // the grey trunk cover of Weekend at Lake Orta
    await s.until(t0, 2100);                                     // the camera holds the card: its trunk cover and "Auto cover"
    await s.click(null, { hold: 110 });                          // → the album: trunk across the cover, three highlights below
    await s.until(t0, 3050);
    await s.move(at('.ac-hl[data-photo="dawn"] .ac-ph', 0, 12), 650);   // onto "Dawn on the pier"
    s.cursor.grab(true);                                         // the hand: this photo can be carried
    await s.until(t0, 3950);
    const [cx] = at('.ac-cover');
    await s.drag([cx, 330], 1050, { pre: 180, post: 250, arc: .05 });   // grab, carry up over the darkened cover, drop at ~5.43 s
    await s.until(t0, 5650);
    await s.move([1080, 735], 560);                              // the hand steps out of the shot: the new cover stays clear
    await s.until(t0, 10450);                                    // the whole new cover with its title, "New cover for the family" up close, then the whole album
  },
});
</script>
</body>
</html>
